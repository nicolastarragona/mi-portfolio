<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Boda Camila & Alexander – Nicolás Tarragona Zurbrigk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Boda Camila & Alexander, fotografía por Nicolás Tarragona Zurbrigk" />

  <!-- Tipografía y CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- AOS Animations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="logo">← Portafolio</a>
    <h1>Camila & Alexander</h1>
  </header>

  <!-- Galería -->
  <main>
    <section class="gallery" id="gallery-cya" aria-label="Galería boda Camila & Alexander"></section>

    <!-- Botón Volver -->
    <div class="back-button">
      <a href="index.html">← Volver al inicio</a>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button class="close" aria-label="Cerrar">&times;</button>
    <img class="lightbox-img" src="" alt="Foto ampliada" />
    <button class="nav left" aria-label="Anterior">&#10094;</button>
    <button class="nav right" aria-label="Siguiente">&#10095;</button>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2025 Nicolás Tarragona Zurbrigk</p>
    <p>
      <a href="https://instagram.com/nicolastz_" target="_blank" rel="noopener">Instagram</a> ·
      <a href="mailto:nicolastarragonaph@gmail.com">Email</a>
    </p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init({ duration: 1000, once: true });</script>

  <script>
    // Variables principales
    const gallery = document.getElementById("gallery-cya");
    const images = [
      "cya-01","cya-02","cya-03","cya-04","cya-05","cya-06","cya-07","cya-08","cya-09",
      "cya-10","cya-11","cya-12","cya-13","cya-14","cya-15","cya-16","cya-17"
    ];
    let currentIndex = 0;

    // Lightbox
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.querySelector(".lightbox-img");
    const closeBtn = document.querySelector(".close");
    const navLeft = document.querySelector(".nav.left");
    const navRight = document.querySelector(".nav.right");

    // Renderizar galería
    function renderGallery() {
      images.forEach((name, index) => {
        const img = document.createElement("img");
        img.src = `img/${name}-600.webp`;
        img.srcset = `
          img/${name}-600.webp 600w,
          img/${name}-1200.webp 1200w
        `;
        img.sizes = "(max-width: 768px) 90vw, 600px";
        img.alt = `Foto boda Camila y Alexander ${index + 1}`;
        img.loading = "lazy";
        img.decoding = "async";
        img.setAttribute("data-aos", "fade-up");
        img.addEventListener("click", () => openLightbox(index));
        gallery.appendChild(img);
      });
    }

    // Abrir lightbox
    function openLightbox(index) {
      currentIndex = index;
      lightboxImg.src = `img/${images[currentIndex]}-1200.webp`;
      lightbox.classList.remove("hidden");
    }

    // Cerrar lightbox
    function closeLightbox() {
      lightbox.classList.add("hidden");
    }

    // Navegación
    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      lightboxImg.src = `img/${images[currentIndex]}-1200.webp`;
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      lightboxImg.src = `img/${images[currentIndex]}-1200.webp`;
    }

    // Eventos
    closeBtn.addEventListener("click", closeLightbox);
    navRight.addEventListener("click", nextImage);
    navLeft.addEventListener("click", prevImage);

    // Teclado
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") nextImage();
      if (e.key === "ArrowLeft") prevImage();
    });

    renderGallery();
  </script>
</body>
</html>
