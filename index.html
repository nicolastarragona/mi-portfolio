<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Portafolio – Nicolás Tarragona Zurbrigk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portafolio fotográfico de Nicolás Tarragona Zurbrigk: retratos, moda, proyectos editoriales y experimentales." />
  
  <!-- Fuente Google -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- AOS CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
</head>
<body>

  <!-- Encabezado -->
  <header>
    <h1 class="site-title">Nicolás Tarragona Zurbrigk</h1>
  </header>

  <!-- Galería de Proyectos -->
  <main class="project-links" aria-label="Portafolio de proyectos">
    <a href="nacho.html" class="project-link" data-aos="zoom-in">
      <img src="img/nachos-01-1200.webp"
           srcset="img/nachos-01-600.webp 600w, img/nachos-01-1200.webp 1200w"
           sizes="(max-width: 600px) 100vw, 400px"
           loading="lazy" decoding="async" alt="Retrato de Nacho" />
      <h2>Nacho</h2>
    </a>

    <a href="techo.html" class="project-link" data-aos="zoom-in">
      <img src="img/techo-01-1200.webp"
           srcset="img/techo-01-600.webp 600w, img/techo-01-1200.webp 1200w"
           sizes="(max-width: 600px) 100vw, 400px"
           loading="lazy" decoding="async" alt="Proyecto TECHO Uruguay" />
      <h2>TECHO Uruguay</h2>
    </a>

    <a href="posthumano.html" class="project-link" data-aos="zoom-in">
      <img src="img/posthumano-01-1200.webp"
           srcset="img/posthumano-01-600.webp 600w, img/posthumano-01-1200.webp 1200w"
           sizes="(max-width: 600px) 100vw, 400px"
           loading="lazy" decoding="async" alt="Proyecto Posthumano" />
      <h2>Posthumano</h2>
    </a>

    <a href="parres.html" class="project-link" data-aos="zoom-in">
      <img src="img/parres-01-1200.webp"
           srcset="img/parres-01-600.webp 600w, img/parres-01-1200.webp 1200w"
           sizes="(max-width: 600px) 100vw, 400px"
           loading="lazy" decoding="async" alt="Serie Parres" />
      <h2>Parres</h2>
    </a>

    <a href="inescapable.html" class="project-link" data-aos="zoom-in">
      <img src="img/inescapable-01-1200.webp"
           srcset="img/inescapable-01-600.webp 600w, img/inescapable-01-1200.webp 1200w"
           sizes="(max-width: 600px) 100vw, 400px"
           loading="lazy" decoding="async" alt="Serie Inescapable" />
      <h2>Inescapable</h2>
    </a>

    <a href="cya.html" class="project-link" data-aos="zoom-in">
      <img src="img/cya-01-1200.webp"
           srcset="img/cya-01-600.webp 600w, img/cya-01-1200.webp 1200w"
           sizes="(max-width: 600px) 100vw, 400px"
           loading="lazy" decoding="async" alt="Boda Camila & Alexander" />
      <h2>Camila & Alexander</h2>
    </a>
  </main>

  <!-- Sobre mí -->
  <section class="about-me" data-aos="fade-up">
    <div class="about-container">
      <figure class="about-photo">
        <img src="img/nico.webp" alt="Foto de Nicolás Tarragona Zurbrigk" width="300" height="400" decoding="async" />
      </figure>
      <div class="about-text">
        <h2>Soy Nico.</h2>
        <p>Hago fotos de personas, momentos e ideas.<br>
        Lo real, lo raro y lo que pasa sin avisar.</p>
        <div class="about-links">
          <a href="mailto:nicolastarragonaph@gmail.com" class="btn">Contáctame</a>
          <a href="https://instagram.com/nicolastz_" target="_blank" rel="noopener" class="btn">Instagram</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 Nicolás Tarragona Zurbrigk</p>
    <nav aria-label="Enlaces redes">
      <a href="https://instagram.com/nicolastz_" target="_blank" rel="noopener">Instagram</a> ·
      <a href="mailto:nicolastarragonaph@gmail.com">Email</a>
    </nav>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init({ duration: 1000, once: true });</script>
  <script src="js/main.js"></script>
</body>
</html>
